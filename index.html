<style>
  :root {
    --bg: #0b0d12;
    --bg-elevated: #12151c;
    --border: #23283333;
    --border-solid: #232833;
    --text: #e7eaf0;
    --text-dim: #8a91a3;
    --accent: #5eead4;
    --accent-2: #818cf8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  .glow {
    position: fixed;
    width: 60vw;
    height: 60vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.18;
    z-index: 0;
    pointer-events: none;
  }
  .glow-1 { background: var(--accent); top: -10%; left: -10%; }
  .glow-2 { background: var(--accent-2); bottom: -15%; right: -10%; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 640px;
    width: 100%;
    padding: 32px;
    text-align: center;
  }

  .terminal {
    background: var(--bg-elevated);
    border: 1px solid var(--border-solid);
    border-radius: 12px;
    text-align: left;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-solid);
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }

  .terminal-title {
    margin-left: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .terminal-body {
    padding: 28px 24px 32px;
  }

  .prompt-line {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .prompt-line .sym {
    color: var(--accent);
    margin-right: 8px;
  }

  .brand {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 14px 0 6px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .status-line {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .status-line .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -3px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .tagline {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 26px;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 11.5px;
    color: var(--text-dim);
    border: 1px solid var(--border-solid);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
  }

  .footer {
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .terminal-body { padding: 22px 18px 26px; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="container">
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">algocompiler.com</span>
      </div>
      <div class="terminal-body">
        <div class="prompt-line"><span class="sym">$</span>algocompiler --status</div>
        <h1 class="brand">AlgoCompiler</h1>
        <div class="status-line">building<span class="cursor"></span></div>
        <p class="tagline">
          A lab for innovative, research-driven software projects.
          Something new is being built here — details soon.
        </p>
        <div class="badges">
          <span class="badge">Research-driven</span>
          <span class="badge">Experimental</span>
          <span class="badge">In the lab</span>
        </div>
      </div>
    </div>
    <p class="footer">
      In the meantime, say hi — <a href="mailto:hello@algocompiler.com">hello@algocompiler.com</a>
    </p>
  </main>
</body>
</html>
